
name: Universal Device Agent Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  prepare:
    name: Find and Prepare Flutter Project
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract Project
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted package

          find_project() {
            find . -type f -name pubspec.yaml \
              -not -path './.git/*' \
              -not -path './package/*' \
              | grep '/shared_app/pubspec.yaml$' \
              | sort \
              | head -n 1 || true
          }

          MANIFEST="$(find_project)"

          if [ -z "$MANIFEST" ]; then
            mapfile -t ZIPS < <(
              find . -type f -iname '*.zip' \
                -not -path './.git/*'
            )

            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "ERROR: No Flutter project or ZIP archive found."
              find . -maxdepth 4 -type f | head -200
              exit 1
            fi

            for archive in "${ZIPS[@]}"; do
              echo "Extracting: $archive"
              unzip -oq "$archive" -d extracted
            done

            MANIFEST="$(find_project)"
          fi

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: ZIP extracted, but shared_app/pubspec.yaml was not found."
            find . -maxdepth 6 -name pubspec.yaml -print
            exit 1
          fi

          APP_DIR="${MANIFEST%/pubspec.yaml}"
          echo "Selected Flutter project: $APP_DIR"

          cp -a "$APP_DIR/." package/

          test -f package/pubspec.yaml
          test -f package/lib/main.dart

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Prepared Project
        uses: actions/upload-artifact@v4
        with:
          name: prepared-flutter-project
          path: package/
          if-no-files-found: error
          retention-days: 1

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/download-artifact@v4
        with:
          name: prepared-flutter-project
          path: source

      - name: Build APK
        working-directory: source
        run: |
          set -e
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/download-artifact@v4
        with:
          name: prepared-flutter-project
          path: source

      - name: Configure Windows
        shell: pwsh
        working-directory: source
        run: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Build Windows
        working-directory: source
        run: |
          flutter pub get
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Windows
          path: source/build/windows/x64/runner/Release/
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/download-artifact@v4
        with:
          name: prepared-flutter-project
          path: source

      - name: Configure Linux
        working-directory: source
        run: |
          if [ ! -f linux/CMakeLists.txt ]; then
            flutter create --platforms=linux .
          fi

      - name: Build Linux
        working-directory: source
        run: |
          flutter pub get
          flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Linux
          path: source/build/linux/x64/release/bundle/
          if-no-files-found: error
